[package]
name = "bapi"
version = "1.0.0"
edition = "2024"

[lib]
name = "bapi"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
tokio = { version = "1", features = ["rt-multi-thread", "process", "time", "macros", "net", "signal"] }
axum = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "multipart", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = "0.25"
ab_glyph = "0.2"
resvg = "0.44"
zip = "2"
